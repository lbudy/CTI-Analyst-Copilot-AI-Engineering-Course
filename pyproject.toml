[project]
name = "cti-analyst-copilot"
version = "0.1.0"
description = "My AI Engineering Buildcamp project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "pydantic>=2.0,<3",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "pypdf>=6,<7",
    "pydantic-ai-slim[openai]>=1,<2",
    "jaxn>=0.0.5",
    "logfire>=5.6.0",
    "pandas>=3.0.6",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
evaluation = [
    "evidently>=0.7.23",
]
ui = [
    "jaxn>=0.0.5",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: paid provider-backed evaluations (explicit opt-in only)"]
